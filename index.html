<!doctype html>
<html lang="en" class="h-full bg-neutral-950">
  <head>
    <meta charset="UTF-8" />
    <script>
      // TMDB API Key for movie poster fetching
      window.TMDB_API_KEY = "71fa515dc2625da7b3ea90b7501d0e8c";
      
      // Defensive handling for sandboxed iframe environments & screenshot capture
      (function() {
        try {
          const desc = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'fetch');
          const nativeFetch = window.fetch ? window.fetch.bind(window) : function() { return Promise.reject(new Error('Fetch not available')); };
          let customFetch = nativeFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch;
            },
            set: function(val) {
              customFetch = typeof val === 'function' ? val : customFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Fallback silently if environment strictly locks properties
        }

        // Prevent SecurityError when screenshot / capture tools read cross-origin cssRules
        try {
          const sheetProto = CSSStyleSheet.prototype;
          const cssRulesDesc = Object.getOwnPropertyDescriptor(sheetProto, 'cssRules');
          if (cssRulesDesc && cssRulesDesc.get) {
            const origGet = cssRulesDesc.get;
            Object.defineProperty(sheetProto, 'cssRules', {
              get: function() {
                try {
                  return origGet.call(this);
                } catch (err) {
                  return [];
                }
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {}

        try {
          const sheetProto = CSSStyleSheet.prototype;
          const rulesDesc = Object.getOwnPropertyDescriptor(sheetProto, 'rules');
          if (rulesDesc && rulesDesc.get) {
            const origGetRules = rulesDesc.get;
            Object.defineProperty(sheetProto, 'rules', {
              get: function() {
                try {
                  return origGetRules.call(this);
                } catch (err) {
                  return [];
                }
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
